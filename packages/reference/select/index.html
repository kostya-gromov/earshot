<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Select · Earshot reference</title>
    <link rel="stylesheet" href="./select.css" />
    <style>
      /* Page chrome only. The component's own styles live in select.css. */
      :root {
        --canvas: #f6f7f9;
        --panel: #ffffff;
        --ink: #16181d;
        --ink-2: #4a505c;
        --line-2: #858c98; /* field border at 3:1 or more against the panel (WCAG 1.4.11) */
        --key: #2f6bff;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --canvas: #0d0e11;
          --panel: #16181d;
          --ink: #e8eaee;
          --ink-2: #a5abb6;
          --line-2: #6b7280;
          --key: #6b95ff;
        }
      }
      body {
        margin: 0;
        min-block-size: 100vh;
        display: grid;
        place-items: start center;
        padding-block: 12vh;
        background: var(--canvas);
        color: var(--ink);
        font:
          15px/1.5 system-ui,
          sans-serif;
      }
      main {
        inline-size: min(520px, 100% - 32px);
        display: grid;
        gap: 16px;
        padding: 24px;
        border-radius: 12px;
        background: var(--panel);
      }
      h1 {
        margin: 0;
        font-size: 20px;
      }
      .subject {
        display: grid;
        gap: 6px;
      }
      .subject label {
        font-weight: 500;
        font-size: 13px;
      }
      .subject input {
        font: inherit;
        padding: 8px;
        border: 1px solid var(--line-2);
        border-radius: 8px;
        background: var(--panel);
        color: inherit;
      }
      .subject input:focus-visible {
        outline: 2px solid var(--key);
        outline-offset: 1px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Order</h1>
      <!-- Focusable fields before and after the select, so the engine can observe Tab arriving
           on it and leaving it instead of reaching the document (docs/proposals/select.md). -->
      <div class="subject">
        <label for="email">Email</label>
        <input id="email" type="email" value="sam@example.com" />
      </div>
      <!-- Markup is loaded from select.html so there is exactly one copy of it. -->
      <div id="mount"></div>
      <div class="subject">
        <label for="notes">Notes</label>
        <input id="notes" type="text" />
      </div>
    </main>

    <script type="module">
      import { createSelect } from './select.js';

      const mount = document.getElementById('mount');
      // Trusted, same-origin static file: the reference markup itself.
      mount.innerHTML = await (await fetch('./select.html')).text();
      const root = mount.querySelector('[data-select]');

      // The five options and the chosen value every target is measured with
      // (docs/proposals/select.md, Scenarios). Two start with "a" so typing can cycle.
      createSelect(root, {
        options: ['Apple', 'Apricot', 'Banana', 'Cherry', 'Date'],
        value: 'Banana',
      });
      // Lets the engine's adapter know the component is usable.
      root.dataset.ready = 'true';
    </script>
  </body>
</html>
