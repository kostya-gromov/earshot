# Pattern in progress (docs/patterns/menu-button.md, proposal approved 2026-11-16). The reference
# is measured first. A system is added only after its export check and inclusion test are
# written here with their date (engine CLAUDE.md, "Choosing what to measure").
menu-button:
  - system: Reference
    status: measured
    adapter: reference
    url: packages/reference/menu-button/index.html (served locally on a free port)
    version-source: packages/reference/package.json
    observations:
      - source: recorded
        rules: [arrows, home-end]
        date: 2026-11-19
        text: 'The arrow keys wrap at both ends, so APG does not ask for Home and End here. The reference has them all the same: Home makes the first item active and End the last.'
      - source: recorded
        rules: [open]
        date: 2026-11-19
        text: 'Down Arrow on the button opens the menu on its first item and Up Arrow on its last; typing a letter in the menu moves to the next item that starts with it. APG marks all three optional.'

  # What is written below was checked on 2026-11-16: the docs page that loaded that day and the
  # installed package. `script` observations: the built page opened in Chromium by a script of
  # ours, the menu opened with Enter, and the attributes on the rest of the page read.
  - system: GitHub Primer
    status: measured
    adapter: primer
    component: ActionMenu (@primer/react)
    docs: https://primer.style/product/components/action-menu/
    url: packages/harness/primer/menu-button.html
    docs-example: https://primer.style/product/components/action-menu/
    version-source: packages/harness/primer/package.json and pnpm-lock.yaml
    checked: 2026-11-16
    setup: 'Built as the “Default” story of ActionMenu: ActionMenu.Button and an ActionList in ActionMenu.Overlay. The third item has the disabled prop; each item’s onSelect writes the page’s “Last action” line. The example was read on the repository’s default branch on 16 Nov 2026, not at the tag of the measured version.'
    variant: 'Primer has two ways to make an item unavailable. Measured is the disabled prop. inactiveText is a different notion, an item whose usual function is unavailable for a time with the reason said, and is not measured.'
    observations:
      - source: recorded
        rules: [arrows, disabled, expanded]
        date: 2026-11-19
        text: 'The arrow keys reach the disabled item: Down Arrow from “Duplicate” made “Archive” active, exposed as disabled, and Enter on it ran no action. The button stays in the accessibility tree while the menu is shown.'
      - source: package-source
        rules: [disabled]
        date: 2026-11-16
        text: '@primer/react 38.45.0 describes the prop in its types (dist/ActionList/shared.d.ts): “Items that are disabled can not be clicked, selected, or navigated through.” The package’s code agrees with the recording, not with the last of the three: ActionList.Item sets aria-disabled="true" on the item and its click and key handlers return before onSelect when it is disabled (dist/ActionList/Item.js); ActionMenu gives its focus zone no filter (dist/ActionMenu/ActionMenu.js), and the focus zone leaves out only natively disabled form controls, not an element with aria-disabled (@primer/behaviors 1.11.0, dist/esm/utils/iterate-focusable-elements.mjs). So the item cannot be clicked or selected, and the arrow keys do reach it.'
    notes:
      - "Current, not deprecated (checked 2026-11-16, before any harness work). The docs page shows the status 'ready' for React. In the installed package (@primer/react 38.45.0) the main entry exports ActionMenu with ActionMenu.Button, ActionMenu.Anchor and ActionMenu.Overlay; the './deprecated' entry exports an older, different ActionMenu, which is not the one measured."
      - "disabled, not inactiveText: decided by the owner on 2026-11-16. The docs page documents inactiveText ('may become inactive and display a message explaining why') and no disabled prop; the prop is in the package's types (ActionList/shared.d.ts)."
      - 'The docs page was cut off before the end of its props; its Accessibility sub-page was not read.'
      - "Inclusion test applied 2026-11-16 on the built page: passes. The engine recorded a button named 'Actions' that opens an element with role='menu' holding four elements with role='menuitem', and no listbox."
